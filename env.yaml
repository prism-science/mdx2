name: mdx2
channels:
  - conda-forge
dependencies:
  - python >=3.10
  - dxtbx
  - hdf5 >=1.14,<2  # pinned for now: HDF5 2.x writes virtual datasets that 1.14 cannot read, and resolves relative
                    # VDS source paths differently (seen 2026-11-05); conda-forge bitshuffle is built against 1.14
  - hdf5plugin
  - bitshuffle  # import_data: Eiger (bitshuffle-LZ4) frames decompressed outside HDF5, in threads
  - numcodecs  # import_data: Blosc compression of datastore chunks outside HDF5, in threads
  - nexusformat
  - pandas
  - scipy
  - numexpr
  - joblib
  - matplotlib
  - ipykernel
  - xarray
  - loguru
  - numba
  - threadpoolctl
  - psutil
